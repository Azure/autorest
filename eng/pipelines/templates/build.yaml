# Template for building projects
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"
    displayName: "Install Node.js"

  - template: /eng/pipelines/templates/install-pnpm.yml

  - script: pnpm install --frozen-lockfile
    displayName: "Install dependencies"

  - script: pnpm run build
    displayName: "Build"
